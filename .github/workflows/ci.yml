name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages and title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The title goes through an environment variable so it is never parsed as shell code.
      - name: Check commit messages and pull request title
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-messages.ps1 -Range "$env:BASE_SHA..$env:HEAD_SHA" -Title $env:PR_TITLE

  powershell:
    name: PowerShell 5.1 syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # PowerShell 7 rejects the 7-only operators by token; Windows PowerShell 5.1 also
      # proves that every script parses on 5.1.
      - name: Check the scripts with PowerShell 7
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/check-powershell-compat.ps1

      - name: Check the scripts with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\check-powershell-compat.ps1

  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Gradle runs on the core's gradleJava from versions/version-matrix.json.
      - name: Build, check formatting and run tests
        run: |
          gradle_java=$(jq -r '.core.gradleJava' versions/version-matrix.json)
          JAVA_HOME="$(printenv "JAVA_HOME_${gradle_java}_X64")" || { echo "No JDK ${gradle_java} set up."; exit 1; }
          export JAVA_HOME
          cd core
          ./gradlew clean build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  fixtures:
    name: Fixture worlds ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.1', '1.21.1', '26.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The vanilla servers need Java 17 (1.20.1), 21 (1.21.1) and 25 (26.3); Gradle runs on 21.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Never committed: a normal-terrain world made with the join client on the vanilla server.
      - name: Make a normal-terrain world
        shell: pwsh
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: ./scripts/make-fixture-world.ps1 -Minecraft $env:MINECRAFT -LevelType normal -OutputRoot build/generated-worlds -Name "normal-$env:MINECRAFT"

      - name: List chunks over several sectors and .mcc files
        run: |
          python3 - build/generated-worlds <<'PY'
          import os, struct, sys
          for root, _, files in os.walk(sys.argv[1]):
              for name in files:
                  path = os.path.join(root, name)
                  if name.endswith('.mcc'):
                      print('external chunk file:', path)
                  if name.endswith('.mca') and os.path.basename(root) == 'region':
                      data = open(path, 'rb').read(4096)
                      counts = [struct.unpack_from('>I', data, i * 4)[0] & 0xFF for i in range(len(data) // 4)]
                      print(path, 'chunks over 1 sector:', sum(1 for c in counts if c > 1), 'max sectors:', max(counts or [0]))
          PY

      - name: Run S1, S2 and S6 on the committed and the generated world, and measure K4 and K5
        run: |
          gradle_java=$(jq -r '.core.gradleJava' versions/version-matrix.json)
          JAVA_HOME="$(printenv "JAVA_HOME_${gradle_java}_X64")" || { echo "No JDK ${gradle_java} set up."; exit 1; }
          export JAVA_HOME
          cd core
          ./gradlew writeFixtureClasspath test --no-daemon -PgeneratedWorlds=../build/generated-worlds \
            --tests '*DryRunFixtureTest' --tests '*PruneFixtureTest' --tests '*DamagedRegionFixtureTest' \
            --tests '*KeepShareMeasurementTest' \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      # Share of the chunks K1 and K8 alone would prune that K4 and K5 keep (ARCHITECTURE).
      - name: Print the K4 and K5 measurements
        run: cat core/build/measurements/*.txt

      - name: Open pruned copies on the vanilla server (S2, S5 interrupted and resumed)
        shell: pwsh
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          ./scripts/check-pruned-world.ps1 -Minecraft $env:MINECRAFT -World "core/src/test/fixtures/worlds/$env:MINECRAFT/world" -Label "committed-$env:MINECRAFT" -SkipBuild -Interrupt
          ./scripts/check-pruned-world.ps1 -Minecraft $env:MINECRAFT -World "core/src/test/fixtures/worlds/$env:MINECRAFT-keep/world" -Label "keep-$env:MINECRAFT" -SkipBuild
          ./scripts/check-pruned-world.ps1 -Minecraft $env:MINECRAFT -World "build/generated-worlds/normal-$env:MINECRAFT/world" -Label "generated-$env:MINECRAFT" -SkipBuild

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-logs-${{ matrix.minecraft }}
          path: |
            build/fixtures/*/logs/
            build/fixtures/*/*.log
            build/fixtures/*/make-log.txt
            build/pruned-check/*/logs/
            build/pruned-check/*/*.log
            core/build/reports/tests/
          if-no-files-found: ignore

  bands:
    name: List bands
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read versions/version-matrix.json
        id: matrix
        run: |
          matrix=$(jq -c '{include: [.bands[] as $b | $b.loaders | to_entries[]
            | {band: $b.id, loader: .key, path: .value.path, artifact: .value.artifact, gradleJava: .value.gradleJava}]}' versions/version-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-band:
    name: ${{ matrix.band }} ${{ matrix.loader }}
    needs: bands
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bands.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Gradle runs on the band's gradleJava and compiles with the band's own toolchain.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        working-directory: ${{ matrix.path }}
        env:
          GRADLE_JAVA: ${{ matrix.gradleJava }}
        run: |
          JAVA_HOME="$(printenv "JAVA_HOME_${GRADLE_JAVA}_X64")" || { echo "No JDK ${GRADLE_JAVA} set up."; exit 1; }
          export JAVA_HOME
          ./gradlew clean build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Smoke test the release JAR on a real dedicated server
        shell: pwsh
        env:
          BAND: ${{ matrix.band }}
          LOADER: ${{ matrix.loader }}
        run: ./scripts/prod-smoke.ps1 -BandId $env:BAND -Loader $env:LOADER -SkipBuild

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.artifact }}
          path: |
            build/prod-smoke/*/logs/
            build/prod-smoke/*/*.log
            build/prod-smoke/*/crash-reports/
          if-no-files-found: ignore

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/build/libs/${{ matrix.artifact }}-*.jar
          if-no-files-found: error

  verify-artifacts:
    name: Verify release artifacts
    needs: build-band
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Each JAR is run with `java -jar --help` on its band's Java version.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Download release JARs
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: chunk-pruner-*
          merge-multiple: true

      - name: Check every band and loader JAR
        shell: pwsh
        run: ./scripts/check-release-artifacts.ps1 -ArtifactsRoot release
