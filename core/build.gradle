plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '8.11.0'
}

def rootProps = new Properties()
file('../gradle.properties').withInputStream { rootProps.load(it) }

group = rootProps.mod_group
version = rootProps.mod_version

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Test only: the LZ4 codec Minecraft 1.21.1 bundles, to read the LZ4 fixture world.
    testImplementation 'org.lz4:lz4-java:1.8.0'
    // Test only: a JSON parser independent of the core's own, to read the reports.
    testImplementation 'com.google.code.gson:gson:2.15.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The test reader keeps the full NBT tree of every chunk of a world; the normal-terrain
    // worlds need more than the default 512 MB.
    maxHeapSize = '2g'
    systemProperty 'chunkpruner.fixtures', file('src/test/fixtures').absolutePath
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.103.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Classpath of the test-only fixture tool, for scripts/check-pruned-world.ps1.
tasks.register('writeFixtureClasspath') {
    dependsOn 'testClasses'
    def target = layout.buildDirectory.file('fixture-classpath.txt')
    def classpath = sourceSets.test.runtimeClasspath
    outputs.file target
    doLast {
        target.get().asFile.text = classpath.asPath
    }
}

// Normal-terrain worlds made in CI (scripts/make-fixture-world.ps1), checked like the committed ones.
if (project.hasProperty('generatedWorlds')) {
    tasks.named('test', Test) {
        systemProperty 'chunkpruner.generatedWorlds', file(project.property('generatedWorlds')).absolutePath
    }
}
