plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.diffplug.spotless' version '8.11.0'
}

apply from: '../shared/band.gradle'

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    // Forge 52 runs with the Mojang names: a JAR renamed to SRG would call methods that do not exist.
    reobf = false
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes('MixinConfigs': 'chunkpruner.mixins.json')
    }
}
